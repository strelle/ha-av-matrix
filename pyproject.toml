[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint.isort]
# like Home Assistant core: "from x import a as b, c as d" stays on one line
combine-as-imports = true
known-first-party = ["custom_components"]

[tool.ruff.lint.per-file-ignores]
# identical copy of server/avmatrix/source_types.py (one rule table for both variants, kept equal by a test)
"custom_components/av_matrix/source_types.py" = ["RUF028"]

[tool.ruff.format]
exclude = ["custom_components/av_matrix/source_types.py"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV Matrix card demo</title>
<!--
  Runs custom:av-matrix-card against a mocked Home Assistant (no HA needed).
  Serve the repository root and open /docs/demo/:
    python3 -m http.server 8765   →   http://localhost:8765/docs/demo/
  Query parameters: theme=light|dark (HA theme)  cardtheme=auto|dark|daylight (card option theme)
                     mode=panel|matrix  take=direct|preset  lang=en|de
                    scenario=preset|multi|history  compact=1  admin=0  still=1
                    proto=dante (Dante® tab)  collapse=WING-FOH,…  srcdev=…  dstdev=…  (device groups / filters)
                    names=label|original|both (name display; overrides the choice stored in the browser)
                    edit=1 (label edit mode)  dlabel=<destination id> / slabel=<source id> (open the label editor)
                    frame=390 (phone-wide frame)
-->
<style>
  :root {
    color-scheme: dark;
    --primary-background-color: #0a0a0a;
    --card-background-color: #1c1c1c;
    --ha-card-background: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --primary-color: #03a9f4;
    --text-primary-color: #ffffff;
    --divider-color: rgba(225, 225, 225, 0.12);
    --success-color: #43a047;
    --warning-color: #ffa600;
    --error-color: #db4437;
  }
  :root.light {
    color-scheme: light;
    --primary-background-color: #e9edf2;
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #6b6f76;
    --divider-color: rgba(0, 0, 0, 0.12);
  }
  html, body { margin: 0; background: var(--primary-background-color); color: var(--primary-text-color);
    font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { padding: 16px; max-width: 1600px; margin: 0 auto; }
  html[style*="--frame"] main { width: var(--frame); max-width: none; margin: 0; padding: 8px; box-sizing: border-box; }
  @media (max-width: 500px) { main { padding: 8px; } }
</style>
<script>
  // HA's <ha-card>, minimal
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;background:var(--ha-card-background,var(--card-background-color));
        border-radius:12px;border:1px solid var(--divider-color);box-shadow:none;color:var(--primary-text-color)}</style><slot></slot>`;
    }
  });
</script>
<script src="../../custom_components/av_matrix/frontend/av-matrix-card.js"></script>
</head>
<body>
<main id="main"></main>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "light") document.documentElement.classList.add("light");
  // frame=390: render inside a phone-wide frame (headless Chrome cannot make windows narrower than ~500 px)
  if (q.get("frame")) document.documentElement.style.setProperty("--frame", q.get("frame") + "px");
  const lang = q.get("lang") || "en";
  const admin = q.get("admin") !== "0";
  const iso = (secAgo) => new Date(Date.now() - secAgo * 1000).toISOString();

  /* ---------------- fake data: 12 sources (2 offline), 6 destinations */
  const S = (id, opts = {}) => ({ id, name: opts.label || id, label: opts.label || null, original_name: id,
    icon_key: opts.icon || (/CAM|PTZ/.test(id) ? "ndi_camera" : "ndi_computer"), tags: opts.tags || [],
    live: opts.live !== false, host: opts.host || "192.0.2." + (40 + Math.floor(Math.random() * 40)),
    address: null, last_seen: opts.live === false ? iso(opts.ago || 420) : iso(2), first_seen: iso(7200) });
  const sources = [
    S("CAM-1 (Program)", { label: "Camera 1 · Wide", tags: ["camera"] }),
    S("CAM-2 (Program)", { label: "Camera 2 · Lectern", tags: ["camera"] }),
    S("CAM-3 (Program)", { label: "Camera 3 · Audience", tags: ["camera"], live: false, ago: 380 }),
    S("PTZ-STAGE (Main)", { label: "PTZ Stage", tags: ["camera", "stage"] }),
    S("STUDIO-PC (Slides)", { label: "Slides", tags: ["presentation"] }),
    S("STUDIO-PC (Notes)", { label: "Confidence notes", tags: ["presentation", "stage"] }),
    S("TRICASTER (PGM 1)", { label: "Program mix", tags: ["mix"] }),
    S("TRICASTER (Multiview)", { label: "Multiview", tags: ["mix"] }),
    S("SIGNAGE-NUC (Loop)", { tags: ["signage"] }),
    S("BIRDDOG-P200 (CAM)", { tags: ["camera"] }),
    S("LAPTOP-GUEST (Display 1)", { tags: ["presentation"] }),
    S("NDI_0A1B2C3D4E", { live: false, ago: 5400 }),
    S("REPLAY (Out A)", { label: "Replay", tags: ["mix"] }),
  ];
  const D = (id, name, cur, status, extra = {}) => ({ id, entity_id: `select.${id}_source`, name: extra.label || name,
    label: extra.label || null, original_name: name, tags: [], channel: null,
    manufacturer: extra.manufacturer || "Magewell", model: extra.model || "Pro Convert NDI to AIO", icon_key: extra.icon || "magewell_ndi_aio",
    device_name: name, device_id: "dev-" + id, entry_id: "entry-" + id, driver: extra.driver || "magewell", protocol: "ndi",
    current_source: cur, current_source_live: true, status, resolution: extra.resolution === undefined ? "1920x1080p50" : extra.resolution,
    available: status !== "offline", locked: !!extra.locked, can_undo: !!extra.can_undo, display: extra.display || null });
  const dests = [
    D("foyer", "AIO-0A1B2C", "SIGNAGE-NUC (Loop)", "connected", {
      resolution: "1920x1080p30", label: "Foyer left",
      display: { entity_id: "media_player.foyer_tv", state: "on", source: "HDMI 2", source_list: ["HDMI 1", "HDMI 2"],
        configured_input: "HDMI 2", auto_on: true, off_on_none: false, error: null } }),
    D("stage_left", "Stage Left", "TRICASTER (PGM 1)", "connected", { can_undo: true, resolution: "3840x2160p50" }),
    D("stage_right", "Stage Right", "STUDIO-PC (Slides)", "connecting", { resolution: null,
      model: "Pro Convert NDI to HDMI", icon: "magewell_pro_convert" }),
    D("confidence", "PRO-CONVERT-3D4E", "STUDIO-PC (Notes)", "connected", { locked: true, resolution: "1280x720p50",
      label: "Confidence", model: "Pro Convert NDI to HDMI", icon: "magewell_pro_convert" }),
    D("green_room", "PLAY-5F6A", "CAM-3 (Program)", "source_lost", { resolution: null, driver: "birddog",
      label: "Green Room", manufacturer: "BirdDog", model: "PLAY", icon: "birddog_play" }),
    D("lobby_bar", "Lobby Bar", null, "offline", { resolution: null, driver: "birddog", manufacturer: null, model: null,
      icon: "ndi_decoder" }),
  ];
  // the offline device still reports a last known source, the green room shows a source that stopped sending
  dests[4].current_source_live = false;
  dests[5].available = false;
  /* ---------------- Dante®: 5 devices, 106 TX / 94 RX channels, one device offline */
  const dSources = [];
  const dDests = [];
  const DANTE = [
    // name, model, tx names, rx names, online, icon_key
    ["STAGEBOX-A", "Stagebox 32x16", ["Kick", "Snare Top", "Snare Bot", "Hi-Hat", "Tom 1", "Tom 2", "Floor Tom", "OH L", "OH R",
      "Bass DI", "Bass Mic", "Gtr 1", "Gtr 2", "Keys L", "Keys R", "Synth L", "Synth R", "Acoustic", "Vox Lead", "Vox BV 1",
      "Vox BV 2", "Vox BV 3", "Talkback", "Spare 24", "Amb L", "Amb R", "Click", "Track L", "Track R", "Spare 30", "Spare 31", "Spare 32"],
      Array.from({ length: 16 }, (_, i) => `Mon ${String(i + 1).padStart(2, "0")}`), true, "dante_device"],
    ["WING-FOH", "WING Dante 64", ["Main L", "Main R", "Sub", "Fill L", "Fill R", ...Array.from({ length: 16 }, (_, i) => `Bus ${i + 1}`),
      ...Array.from({ length: 43 }, (_, i) => `Card ${String(i + 22).padStart(2, "0")}`)],
      Array.from({ length: 64 }, (_, i) => `Ch ${String(i + 1).padStart(2, "0")}`), true, "wing"],
    ["AVIOAES3-0a1b2c", "AVIO AES3", ["CH1", "CH2"], ["CH1", "CH2"], true, "avio_aes3"],
    ["DA-22UC-6f7a8b", "DA-22UC", ["L", "R"], ["CH1", "CH2"], true, "dante_converter"],
    ["AVIOAI2-4c5d6e", "AVIO Analog In 2ch", ["CH1", "CH2"], [], true, "avio_analog_in"],
    ["AVIOAO2-7e8f90", "AVIO Analog Out 2ch", [], ["CH1", "CH2"], true, "avio_analog_out"],
    ["AVIOUSBC-3d4e5f", "AVIO USB-C", ["CH1", "CH2"], ["CH1", "CH2"], false, "avio_usb"],
  ];
  const DEV = Object.fromEntries(DANTE.map((x, i) => [x[0], { model: x[1], online: x[4], icon: x[5], host: "192.0.2." + (100 + i) }]));
  // some channel labels
  const SRC_LABELS = { "Vox Lead@STAGEBOX-A": "Lead vocal", "Kick@STAGEBOX-A": "Kick in", "Main L@WING-FOH": "PA left",
    "Main R@WING-FOH": "PA right", "CH1@AVIOAI2-4c5d6e": "Lectern mic", "CH2@AVIOAI2-4c5d6e": "Wireless 1" };
  const DST_LABELS = { "AVIOAES3-0a1b2c:1": "Lobby L", "AVIOAES3-0a1b2c:2": "Lobby R",
    "DA-22UC-6f7a8b:1": "Hall fill L", "DA-22UC-6f7a8b:2": "Hall fill R", "AVIOAO2-7e8f90:1": "Sub amp" };
  for (const [dev, , tx, , online] of DANTE)
    for (const ch of tx) {
      const id = `${ch}@${dev}`;
      const label = SRC_LABELS[id] || null;
      dSources.push({ id, group: dev, channel: ch, name: label || id, label, original_name: id, icon_key: DEV[dev].icon,
        tags: [], live: online, host: DEV[dev].host, address: null,
        last_seen: online ? iso(2) : iso(260), first_seen: iso(9000) });
    }
  const SUB = { subscribed: ["DYNAMIC", "Subscribed (unicast)"], none: ["NONE", "No subscription"],
    unresolved: ["UNRESOLVED", "The transmitting device is not on the network"], error: ["CHANNEL_FORMAT", "Channel formats do not match"] };
  const routing = {
    "WING-FOH": (i) => (i < 32 ? `${DANTE[0][2][i]}@STAGEBOX-A` : i < 34 ? `CH${i - 31}@AVIOUSBC-3d4e5f`
      : i < 36 ? `CH${i - 33}@AVIOAI2-4c5d6e` : null),
    "STAGEBOX-A": (i) => (i < 12 ? `Bus ${i + 1}@WING-FOH` : null),
    "AVIOAES3-0a1b2c": (i) => [`Main L@WING-FOH`, `Main R@WING-FOH`][i],
    "DA-22UC-6f7a8b": (i) => [`Fill L@WING-FOH`, `Fill R@WING-FOH`][i],
    "AVIOAO2-7e8f90": (i) => [`Sub@WING-FOH`, null][i],
    "AVIOUSBC-3d4e5f": (i) => [`Main L@WING-FOH`, `Main R@WING-FOH`][i],
  };
  for (const [dev, , , rx, online] of DANTE) {
    rx.forEach((ch, i) => {
      const cur = routing[dev](i);
      const src = dSources.find((x) => x.id === cur);
      let sub = !cur ? "none" : src && src.live ? "subscribed" : "unresolved";
      if (dev === "AVIOAO2-7e8f90" && i === 0) sub = "error";
      const status = !online ? "offline" : { subscribed: "connected", none: "no_source", unresolved: "source_lost", error: "error" }[sub];
      const slug = `${dev}_${ch}`.toLowerCase().replace(/[^a-z0-9]+/g, "_");
      const label = DST_LABELS[`${dev}:${i + 1}`] || null;
      dDests.push({ id: `dante-network_${dev}:${i + 1}`, entity_id: rx.length > 32 ? null : `select.${slug}_source`,
        name: label || `${dev} · ${ch}`, label, original_name: `${dev} · ${ch}`, tags: [],
        manufacturer: dev.startsWith("WING") ? "Behringer" : dev.startsWith("AVIO") ? "Audinate" : null, model: DEV[dev].model,
        icon_key: DEV[dev].icon, channel: ch, group: dev, device_name: dev, device_id: "dev-" + dev, entry_id: "entry-dante",
        driver: "dante", protocol: "dante", current_source: cur, current_source_live: !!(src && src.live), status,
        resolution: "48 kHz", available: online, locked: dev === "AVIOAO2-7e8f90" && i === 1, can_undo: false, display: null,
        subscription: { state: sub, code: null, status: SUB[sub][0], detail: SUB[sub][1] } });
    });
  }
  const snap = { version: "0.3.0", protocols: { ndi: { title: "NDI®", sources, destinations: dests },
    dante: { title: "Dante®", sources: dSources, destinations: dDests } } };
  const allDests = () => [...dests, ...dDests];
  const allSources = () => [...sources, ...dSources];
  const history = { }; // dest id → stack
  const states = { "media_player.foyer_tv": { state: "on" } };

  /* ---------------- mock connection */
  const subs = new Set();
  const evSubs = new Set();
  let pushTimer = null;
  const push = () => {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => subs.forEach((cb) => cb(JSON.parse(JSON.stringify(snap)))), 200);
  };
  const users = [{ id: "u-daniel", name: "Daniel" }, { id: "u-tech", name: "Tech desk" }, { id: "u-auto", name: "Automation" }];
  const fire = (dest, source, previous, origin, userId) => {
    const ev = { event_type: "av_matrix_routed", time_fired: new Date().toISOString(), context: { user_id: userId },
      data: { entity_id: dest.entity_id, destination: dest.id, destination_name: dest.name, protocol: dest.protocol,
        source, previous_source: previous, origin } };
    evSubs.forEach((cb) => cb(ev));
  };
  const route = (dest, source, origin, userId = "u-daniel", record = true) => {
    if (dest.locked) throw new Error(`Destination ${dest.name} is locked`);
    if (!dest.available) throw new Error(`${dest.name}: device unreachable`);
    const prev = dest.current_source;
    const sid = source === "None" ? null : source;
    if (record && prev !== sid) (history[dest.id] ||= []).push(prev);
    dest.current_source = sid;
    const src = allSources().find((s) => s.id === sid);
    dest.current_source_live = !sid || !!(src && src.live);
    dest.status = !sid ? "no_source" : "connecting";
    if (dest.subscription) dest.subscription = !sid ? { state: "none", status: "NONE", detail: "No subscription" }
      : { state: "in_progress", status: "IN_PROGRESS", detail: "Setting up the flow" };
    dest.can_undo = !!(history[dest.id] && history[dest.id].length);
    fire(dest, sid, prev, origin, userId);
    push();
    setTimeout(() => {
      if (dest.current_source !== sid) return;
      dest.status = !sid ? "no_source" : dest.current_source_live ? "connected" : "source_lost";
      if (dest.subscription) {
        dest.subscription = !sid ? { state: "none", status: "NONE", detail: "No subscription" }
          : dest.current_source_live ? { state: "subscribed", status: "DYNAMIC", detail: "Subscribed (unicast)" }
          : { state: "unresolved", status: "UNRESOLVED", detail: "The transmitting device is not on the network" };
      } else dest.resolution = dest.status === "connected" ? "1920x1080p50" : null;
      push();
    }, 1400);
  };
  const byEntity = (eid) => allDests().find((d) => d.entity_id === eid || d.id === eid);
  const target = (data) => byEntity(data.entity_id || (data.destination || [])[0]);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const hass = {
    language: lang,
    themes: { darkMode: q.get("theme") !== "light" },
    locale: { language: lang },
    user: { id: "u-daniel", name: "Daniel", is_admin: admin },
    states,
    entities: {},
    connection: {
      subscribeMessage(cb, msg) {
        if (msg.type !== "av_matrix/subscribe") return Promise.reject(new Error("unknown command"));
        subs.add(cb);
        setTimeout(() => cb(JSON.parse(JSON.stringify(snap))), 50);
        return Promise.resolve(() => subs.delete(cb));
      },
      subscribeEvents(cb, type) {
        evSubs.add(cb);
        return Promise.resolve(() => evSubs.delete(cb));
      },
      async sendMessagePromise(msg) {
        if (msg.type === "av_matrix/label" && msg.kind === "destination") {
          if (!admin) throw new Error("Unauthorized");
          const d = allDests().find((x) => x.id === msg.destination);
          if (!d) throw new Error(`Unknown destination ${msg.destination}`);
          d.label = (msg.label || "").trim() || null;
          d.name = d.label || d.original_name;
          d.tags = msg.tags || [];
          push();
          return d.label || d.tags.length ? { ...(d.label ? { label: d.label } : {}), ...(d.tags.length ? { tags: d.tags } : {}) } : {};
        }
        if (msg.type === "av_matrix/label") {
          const s = allSources().find((x) => x.id === msg.source);
          s.label = msg.label || null;
          s.name = s.label || s.id;
          s.tags = msg.tags || [];
          push();
          return s.label ? { label: s.label, tags: s.tags } : {};
        }
        if (msg.type === "av_matrix/state") return JSON.parse(JSON.stringify(snap));
        throw new Error("unknown command");
      },
    },
    async callWS(msg) {
      if (msg.type === "config/auth/list") return users;
      throw new Error("unknown command");
    },
    async callService(domain, service, data) {
      await sleep(180);
      if (domain === "av_matrix") {
        if (service === "route") return route(target(data), data.source, "service");
        if (service === "salvo") {
          const plan = data.routes.map((r) => [byEntity(r.destination), r.source]);
          const bad = plan.find(([d]) => d.locked || !d.available);
          if (bad) throw new Error(`Destination ${bad[0].name} is ${bad[0].locked ? "locked" : "unreachable"}`);
          plan.forEach(([d, s]) => route(d, s, "salvo"));
          return;
        }
        if (service === "lock" || service === "unlock") {
          target(data).locked = service === "lock";
          return push();
        }
        if (service === "undo") {
          const d = target(data);
          const prev = (history[d.id] || []).pop();
          route(d, prev === undefined ? d.current_source : prev ?? "None", "undo", "u-daniel", false);
          d.can_undo = !!(history[d.id] && history[d.id].length);
          return push();
        }
      }
      if (domain === "media_player") {
        const d = dests.find((x) => x.display && x.display.entity_id === data.entity_id);
        d.display.state = service === "turn_on" ? "on" : "off";
        return push();
      }
      throw new Error(`Unknown service ${domain}.${service}`);
    },
  };

  /* ---------------- mount */
  const card = document.createElement("av-matrix-card");
  card.setConfig({
    type: "custom:av-matrix-card",
    title: q.get("title") || "Video routing · Hall A",
    mode: q.get("mode") || "panel",
    take_mode: q.get("take") || "direct",
    compact: q.get("compact") === "1",
    ...(q.get("cardtheme") ? { theme: q.get("cardtheme") } : {}),
    ...(q.get("proto") ? { protocol: q.get("proto") } : {}),
  });
  if (["label", "original", "both"].includes(q.get("names"))) card._nameMode = q.get("names");
  if (q.get("edit") === "1") card._editMode = true;
  // phone frame + mode=matrix: open the matrix although narrow cards start in panel mode
  if (q.get("frame") && q.get("mode")) card._modeUser = q.get("mode");
  if (q.get("collapse")) {
    card._collapsed = new Set(q.get("collapse").split(",").filter(Boolean));
    card._expanded = new Set((q.get("expand") || "").split(",").filter(Boolean));
  } else if (q.get("proto")) {
    card._collapsed = new Set();
    card._expanded = new Set((q.get("expand") || "").split(",").filter(Boolean));
  }
  if (q.get("srcdev")) card._srcGroup = q.get("srcdev");
  if (q.get("dstdev")) card._dstGroup = q.get("dstdev");
  card.hass = hass;
  document.getElementById("main").appendChild(card);
  window.card = card;
  // still=1: no CSS transitions (headless screenshots use virtual time, which does not advance transitions)
  if (q.get("still") === "1") {
    const st = document.createElement("style");
    st.textContent = "*,*::before,*::after{transition:none!important}.history li,.toast{animation:none!important}";
    card.shadowRoot.appendChild(st);
  }
  window.mock = { hass, snap, route };

  /* ---------------- scenarios for screenshots */
  const sr = () => card.shadowRoot;
  const click = (sel, opts = {}) => {
    const el = sr().querySelector(sel);
    if (el) el.dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true, ...opts }));
  };
  const scenario = q.get("scenario") || "";
  setTimeout(async () => {
    if (scenario.includes("history")) {
      route(dests[1], "CAM-1 (Program)", "service", "u-tech");
      await sleep(30);
      route(dests[1], "TRICASTER (PGM 1)", "salvo", "u-daniel");
      await sleep(30);
      route(dests[0], "SIGNAGE-NUC (Loop)", "select", "u-auto");
      await sleep(250);
      click('[data-act="history"]');
    }
    if (scenario.includes("preset")) {
      // arm two destinations: Stage Left → Camera 2 (panel: select), Stage Right → PTZ
      if ((q.get("mode") || "panel") === "matrix") {
        click('[data-act="xp"][data-d="stage_left"][data-s="CAM-2 (Program)"]');
        click('[data-act="xp"][data-d="stage_right"][data-s="PTZ-STAGE (Main)"]');
        click('[data-act="xp"][data-d="foyer"][data-s="STUDIO-PC (Slides)"]');
      } else {
        click('[data-act="dest"][data-d="stage_left"]');
        click('[data-act="dest"][data-d="stage_right"]', { shiftKey: true });
        click('[data-act="src"][data-s="CAM-2 (Program)"]');
      }
    } else if (scenario.includes("multi")) {
      click('[data-act="dest"][data-d="stage_left"]');
    } else if ((q.get("mode") || "panel") === "panel" && !q.get("proto")) {
      click('[data-act="dest"][data-d="stage_left"]');
    } else if (q.get("seldest")) {
      click(`[data-act="dest"][data-d="${q.get("seldest")}"]`);
    }
    if (q.get("perf")) {
      // perf=1: time a full re-render of the current view (e.g. the 94 x 106 Dante matrix)
      const t0 = performance.now();
      for (let i = 0; i < 5; i++) { card._lastHtml = ""; card._render(); }
      document.title = `render ${((performance.now() - t0) / 5).toFixed(1)} ms, ${card.shadowRoot.querySelectorAll(".xp").length} crosspoints`;
    }
    if (q.get("dlabel")) card._openLabel("destination", q.get("dlabel"));
    if (q.get("slabel")) card._openLabel("source", q.get("slabel"));
    if (q.get("hover")) {
      const [r, c] = q.get("hover").split(",");
      card._setCross(r, c);
    }
  }, 300);
})();
</script>
</body>
</html>

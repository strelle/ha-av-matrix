<title>Rig-Konfigurator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<style>
/* Strelle Pult-UI. Bibliothek | Arbeitsfläche (Raster, Zoom, Wegsucher) | Inspektor.
   Rot = wirkt aufs Signal, Bernstein = vorgemerkt/Warnung, Grün = ok, Strelle-Blau nur Auswahl, Ziel, Fokus. */
:root {
  --sp-bg: #e9edf2; --sp-surface: #ffffff; --sp-surface-2: #f3f5f8; --sp-surface-3: #e1e6ed;
  --sp-line: #c9d0da; --sp-line-strong: #6f7884; --sp-fg: #0d1117; --sp-fg-muted: #3d444f;
  --sp-select: oklch(0.5361 0.1495 253.41); --sp-on-select: #ffffff; --sp-focus: oklch(0.47 0.15 253);
  --sp-live: #d42b24; --sp-cue: #9c6200; --sp-ok: #1a8a4a; --grid-dot: #c9d0da;
  --sig-video: #2f6fe0; --sig-audio: #e5781a; --sig-net: #7f52e0; --sig-ctrl: #3b3f46;
  --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-ctl: 12px; --r-module: 18px; --r-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sp-bg: #0a0a0a; --sp-surface: #121212; --sp-surface-2: #1a1b1e; --sp-surface-3: #24262b;
  --sp-line: #2c2f35; --sp-line-strong: #6b7380; --sp-fg: #efedea; --sp-fg-muted: #a3a19c;
  --sp-focus: oklch(0.72 0.12 250); --sp-live: #ff4b42; --sp-cue: #ffb020; --sp-ok: #3ddc84; --grid-dot: #24262b;
  --sig-video: #4e8fff; --sig-audio: #ff9b3d; --sig-net: #a87bff; --sig-ctrl: #a3a19c; color-scheme: dark } }
:root[data-theme="dark"] {
  --sp-bg: #0a0a0a; --sp-surface: #121212; --sp-surface-2: #1a1b1e; --sp-surface-3: #24262b;
  --sp-line: #2c2f35; --sp-line-strong: #6b7380; --sp-fg: #efedea; --sp-fg-muted: #a3a19c;
  --sp-focus: oklch(0.72 0.12 250); --sp-live: #ff4b42; --sp-cue: #ffb020; --sp-ok: #3ddc84; --grid-dot: #24262b;
  --sig-video: #4e8fff; --sig-audio: #ff9b3d; --sig-net: #a87bff; --sig-ctrl: #a3a19c; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--sp-bg); color: var(--sp-fg); font-family: var(--ui); font-size: 15px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 10px; box-sizing: border-box; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.top h1 { font-size: 20px; font-weight: 700; margin: 0 6px 0 0; }
.top .proj { font-family: var(--mono); color: var(--sp-fg-muted); font-size: 13px; }
.spacer { flex: 1; }
.btn { font: 600 14px var(--ui); min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: var(--r-ctl); border: 1px solid var(--sp-line-strong); background: var(--sp-surface-3); color: var(--sp-fg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn:hover { border-color: var(--sp-fg-muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.take { background: var(--sp-select); color: var(--sp-on-select); border-color: transparent; border-radius: var(--r-pill); }
.btn:focus-visible, .lib-item:focus-visible, .node:focus-visible, .seg button:focus-visible { outline: 3px solid var(--sp-focus); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--sp-line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { font: 600 14px var(--ui); min-height: 44px; padding: 0 14px; border: 0; background: var(--sp-surface-3); color: var(--sp-fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--sp-select); color: var(--sp-on-select); }
.zoom { display: inline-flex; align-items: center; gap: 4px; }
.zoom output { font-family: var(--mono); font-size: 13px; min-width: 48px; text-align: center; }
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr) 320px; gap: 10px; min-height: 0; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } .lib, .insp { max-height: 40vh; } }
.panel { background: var(--sp-surface-2); border: 1px solid var(--sp-line); border-radius: var(--r-module); overflow: auto; min-height: 0; }
.panel h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--sp-fg-muted); margin: 14px 14px 6px; }
.lib-item { display: flex; flex-direction: column; justify-content: center; min-height: 52px; margin: 6px 10px; padding: 6px 12px; border-radius: var(--r-ctl); border: 1px solid var(--sp-line-strong); background: var(--sp-surface-3); cursor: grab; user-select: none; }
.lib-item b { font-weight: 600; font-size: 14px; } .lib-item span { font-size: 12px; color: var(--sp-fg-muted); }
.lib-item.kit { border-style: dashed; }
.lib-search { margin: 4px 10px 8px; width: calc(100% - 20px); box-sizing: border-box; min-height: 44px; border-radius: var(--r-ctl); border: 1px solid var(--sp-line-strong); background: var(--sp-surface); color: var(--sp-fg); font: 14px var(--ui); padding: 0 10px; }
.ws { position: relative; overflow: auto; background: var(--sp-bg); border: 1px solid var(--sp-line); border-radius: var(--r-module); }
.ws.drop { outline: 3px dashed var(--sp-select); outline-offset: -6px; }
.sizer { position: relative; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0;
  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1.2px); background-size: 10px 10px; }
svg.wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 3; }
svg.wires path { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; pointer-events: stroke; cursor: pointer; }
svg.wires path.halo { stroke: var(--sp-bg); stroke-width: 12; pointer-events: stroke; cursor: pointer; }
svg.wires path.csel { stroke-width: 4.5; filter: drop-shadow(0 0 3px var(--sp-select)); }
svg.wires path.fixed { opacity: .8; }
svg.wires path.drag { stroke: var(--sp-select); stroke-dasharray: 6 5; stroke-width: 2.5; pointer-events: none; }
svg.wires path.hot { stroke-width: 3.4; stroke-dasharray: 7 9; animation: flow .7s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce) { svg.wires path.hot { animation: none; stroke-dasharray: none; } }
.rack { position: absolute; border: 2px solid var(--sp-line-strong); border-radius: var(--r-module); z-index: 1; }
.rack > .rh { position: absolute; top: -15px; left: 14px; background: var(--sp-bg); padding: 0 8px; font-weight: 700; font-size: 14px; cursor: grab; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.rack > .rh small { font-weight: 500; color: var(--sp-fg-muted); font-family: var(--mono); font-size: 11px; }
.fold { font: 600 12px var(--ui); min-height: 26px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--sp-line-strong); background: var(--sp-surface-3); color: var(--sp-fg); cursor: pointer; }
.node { position: absolute; z-index: 2; width: max-content; min-width: 200px; max-width: 420px; background: var(--sp-surface-2); border: 1px solid var(--sp-line-strong); border-radius: var(--r-ctl); }
.node.sel { box-shadow: inset 0 3px 0 var(--sp-select); border-color: var(--sp-select); }
.node.group { border-width: 2px; border-style: double; }
.node .nh { padding: 8px 12px 6px; background: var(--sp-surface-3); border-radius: var(--r-ctl) var(--r-ctl) 0 0; cursor: grab; }
.node .nh b { display: block; font-size: 14px; font-weight: 700; line-height: 1.25; }
.node .nh .model { display: block; font-family: var(--mono); font-size: 11px; color: var(--sp-fg-muted); line-height: 1.35; white-space: normal; }
.node .contents { padding: 6px 12px; font-size: 12px; color: var(--sp-fg-muted); display: grid; gap: 2px; border-bottom: 1px solid var(--sp-line); }
.ports { display: grid; grid-template-columns: max-content max-content; column-gap: 28px; justify-content: space-between; padding: 4px 0 6px; }
.pcol.r { text-align: right; }
.port { position: relative; font-family: var(--mono); font-size: 11.5px; line-height: 20px; height: 22px; padding: 0 22px; white-space: nowrap; cursor: crosshair; }
.port i { position: absolute; top: 5px; width: 10px; height: 10px; border-radius: 50%; }
.pcol.l .port i { left: 7px; } .pcol.r .port i { right: 7px; }
.port.ok i { box-shadow: 0 0 0 3px var(--sp-select); } .port.ok { color: var(--sp-select); font-weight: 600; }
.port.no { opacity: .35; }
.port .cnt { color: var(--sp-fg-muted); }
.z-mid .node .model, .z-low .node .model, .z-low .ports, .z-low .contents { display: none; }
.z-low .node { min-width: 160px; } .z-low .nh b { font-size: 18px; }
.insp { padding-bottom: 12px; }
.insp .sec { margin: 0 14px 12px; }
.insp dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
.insp dt { color: var(--sp-fg-muted); } .insp dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.insp select { font: 14px var(--ui); min-height: 44px; width: 100%; border-radius: var(--r-ctl); border: 1px solid var(--sp-line-strong); background: var(--sp-surface); color: var(--sp-fg); padding: 0 8px; }
.hint { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--sp-line); font-size: 13px; }
.hint b { font-weight: 600; } .hint p { margin: 0; grid-column: 2; color: var(--sp-fg-muted); }
.shape { width: 12px; height: 12px; margin-top: 3px; }
.shape.ok { border-radius: 50%; background: var(--sp-ok); }
.shape.warn { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--sp-cue); }
.shape.err { background: var(--sp-live); border-radius: 2px; }
.toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--sp-fg); color: var(--sp-bg); padding: 10px 16px; border-radius: var(--r-ctl); font-size: 14px; display: none; z-index: 30; max-width: 80vw; }
.cablelist { font-family: var(--mono); font-size: 12px; display: grid; gap: 4px; }
.cablelist div { display: flex; gap: 6px; align-items: center; }
.cablelist button { margin-left: auto; font: 600 12px var(--ui); min-height: 30px; border-radius: 8px; border: 1px solid var(--sp-line-strong); background: var(--sp-surface-3); color: var(--sp-fg); cursor: pointer; }
input[type=file] { display: none; }
</style>

<div class="app" id="app">
  <div class="top">
    <h1>Rig-Konfigurator</h1>
    <span class="proj" id="projname"></span>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Beispiel laden"><button type="button" data-load="schlank">Schlank</button><button type="button" data-load="krems">Krems</button><button type="button" data-load="leer">Leer</button></div>
    <button type="button" class="btn" id="undo" title="Rückgängig (Cmd+Z)">↶ Rückgängig</button>
    <button type="button" class="btn" id="redo" title="Wiederholen (Shift+Cmd+Z)">↷ Wiederholen</button>
    <div class="zoom" role="group" aria-label="Zoom"><button type="button" class="btn" id="zout" aria-label="Verkleinern">−</button><output id="zval">100 %</output><button type="button" class="btn" id="zin" aria-label="Vergrößern">+</button><button type="button" class="btn" id="zfit">Einpassen</button></div>
    <label class="btn" for="imp">Importieren</label><input type="file" id="imp" accept=".json,.avrig">
    <button type="button" class="btn take" id="exp">Projekt exportieren</button>
  </div>
  <div class="cols">
    <div class="panel lib" id="lib"></div>
    <div class="ws" id="ws"><div class="sizer" id="sizer"><div class="stage" id="stage"><svg class="wires" id="wires"></svg></div></div></div>
    <div class="panel insp" id="insp"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = /*DATA*/null;
const PROF = DATA.profiles, RACKS = DATA.racks, KITS = DATA.kits, GEN = DATA.generic;
const G = 10, GAPN = 30; // Raster und Mindestabstand zwischen Kacheln
const prof = id => PROF[id] || GEN[id] || {model: id, ports: []};
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const split = r => r.split(":"), base = p => p.split(".")[0], snap = v => Math.round(v / G) * G;
let S = null, sel = null, selCable = null, past = [], future = [], Z = 1;
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3200); };
const commit = () => { past.push(JSON.stringify(S)); if (past.length > 100) past.shift(); future = []; syncUndo(); };
function syncUndo() { $("#undo").disabled = !past.length; $("#redo").disabled = !future.length; }
function undo() { if (!past.length) return toast("Nichts zum Rückgängigmachen"); future.push(JSON.stringify(S)); S = JSON.parse(past.pop()); render(); showHints(); syncUndo(); }
function redo() { if (!future.length) return; past.push(JSON.stringify(S)); S = JSON.parse(future.pop()); render(); showHints(); syncUndo(); }

// ---------- Signalart und Passprüfung ----------
const inst = id => S.instances.find(i => i.id === id);
const portDef = (iid, p) => { const n = inst(iid); return n && (prof(n.profile).ports || []).find(x => x.id === base(p)); };
function kind(d) { const s = ((d?.signal || "") + " " + (d?.connector || "")).toLowerCase();
  if (/audio|dante|aes|xlr|trs|madi/.test(s)) return "audio"; if (/ethernet|rj45|internet|rtmp|ndi/.test(s) && !/2110/.test(s)) return "net";
  if (/usb/.test(s) && !/display/.test(s)) return "ctrl"; return "video"; }
const fam = c => { c = (c || "").toLowerCase();
  return /bnc/.test(c) ? "bnc" : /hdmi/.test(c) ? "hdmi" : /xlr|combo/.test(c) ? "xlr" : /trs|klinke/.test(c) ? "trs" : /rj45|ethercon/.test(c) ? "rj45" : /lc|sfp/.test(c) ? "lc" : /usb/.test(c) ? "usb" : /internet/.test(c) ? "inet" : c; };
function check(a, b) {
  if (a.i === b.i) return {ok: false, why: "Gleiches Gerät"};
  const da = portDef(a.i, a.p), db = portDef(b.i, b.p); if (!da || !db) return {ok: false, why: "Unbekannte Buchse"};
  if (da.direction === "in") return {ok: false, why: "Start ist ein Eingang"};
  if (db.direction === "out") return {ok: false, why: "Ausgang auf Ausgang"};
  const fa = fam(da.connector), fb = fam(db.connector), sa = (da.signal || "").toLowerCase(), sb = (db.signal || "").toLowerCase();
  if (/2110/.test(sa + sb)) { if (/2110/.test(sa) && /2110/.test(sb)) return {ok: false, why: "2110 läuft über einen 10G-Switch, nicht direkt"};
    const tgt = /2110/.test(sa) ? db : da; if (!/10g|2110/i.test((tgt.signal || "") + (tgt.notes || "") + tgt.id)) return {ok: false, why: "ST 2110 braucht einen echten 10G-Port – an 1G/2,5G kommt kein Bild"}; }
  const audio = new Set(["xlr", "trs"]);
  if (fa === fb || (audio.has(fa) && audio.has(fb))) return {ok: true, warn: fa !== fb ? "Adapter XLR↔Klinke nötig" : null};
  if ((fa === "bnc" && fb === "hdmi") || (fa === "hdmi" && fb === "bnc")) return {ok: false, why: "SDI und HDMI passen nicht – Wandler einplanen"};
  if ((fa === "rj45" && fb === "inet") || (fa === "inet" && fb === "rj45")) return {ok: true};
  return {ok: false, why: `${da.connector} passt nicht auf ${db.connector}`};
}
const used = (iid, p) => S.cables.filter(c => c.from.startsWith(iid + ":" + p) || c.to.startsWith(iid + ":" + p));
function nextFree(iid, p) { const d = portDef(iid, p), n = d?.count || 1; if (n === 1) return p;
  const taken = new Set(S.cables.flatMap(c => [c.from, c.to]).filter(r => r.startsWith(iid + ":" + p + ".")).map(r => +r.split(".").pop()));
  for (let k = 1; k <= n; k++) if (!taken.has(k)) return `${p}.${k}`; return null; }

// ---------- Größen, Raster, keine Überlagerung ----------
const SZ = {}; // gemessene Größe je Kachel
const box = n => ({x: n.x, y: n.y, w: SZ[n.id]?.w || 240, h: SZ[n.id]?.h || 200});
const visible = () => S.instances.filter(n => !collapsedRack(n));
const collapsedRack = n => n.rack && S.racks.find(r => r.id === n.rack)?.collapsed;
function hit(a, b) { return a.x < b.x + b.w + GAPN && b.x < a.x + a.w + GAPN && a.y < b.y + b.h + GAPN && b.y < a.y + a.h + GAPN; }
function blockers(ids) { const set = new Set(ids); return [...visible().filter(n => !set.has(n.id)).map(box), ...groupBoxes().filter(g => !ids.includes(g.id))]; }
function placeGroup(ids, prefer) { // Gruppe von Kacheln ins Raster und auf freien Platz schieben
  const ns = ids.map(inst).filter(Boolean); if (!ns.length) return;
  const others = blockers(ids);
  const fits = (dx, dy) => ns.every(n => { const b = box(n); b.x += dx; b.y += dy; return b.x >= 0 && b.y >= 20 && !others.some(o => hit(b, o)); });
  const sx = snap(ns[0].x) - ns[0].x, sy = snap(ns[0].y) - ns[0].y;
  for (let r = 0; r < 400; r++) for (let a = -r; a <= r; a++) for (const [dx, dy] of [[a, -r], [a, r], [-r, a], [r, a]]) {
    const X = sx + dx * G, Y = sy + dy * G; if (fits(X, Y)) { ns.forEach(n => { n.x += X; n.y += Y; }); return; } }
}

// ---------- Projekt laden / Bausteine einfügen ----------
function uid(id) { let k = id, n = 2; while (S.instances.some(i => i.id === k)) k = `${id}${n++}`; return k; }
function insertBlock(insts, cables, extra) { const map = {};
  insts.forEach(it => { const id = uid(it.id); map[it.id] = id; S.instances.push({...it, id, ...extra, x: 0, y: 0}); });
  cables.forEach(c => { const [fi, fp] = split(c.from), [ti, tp] = split(c.to); if (map[fi] && map[ti]) S.cables.push({...c, from: map[fi] + ":" + fp, to: map[ti] + ":" + tp}); });
  return Object.values(map); }
function stack(ids, at) { // zweispaltig: erst Spalten nach Höhe verteilen, dann Spalte 2 hinter die breiteste Kachel von Spalte 1
  const ns = ids.map(inst).filter(Boolean), ys = [0, 0], col = [[], []];
  ns.forEach(n => { const c = ys[0] <= ys[1] ? 0 : 1; col[c].push(n); ys[c] += (SZ[n.id]?.h || 200) + GAPN + 10; });
  const w0 = Math.max(0, ...col[0].map(n => SZ[n.id]?.w || 260));
  col.forEach((list, c) => { let y = at.y + 40; list.forEach(n => { n.x = snap(at.x + 20 + (c ? w0 + GAPN + 20 : 0)); n.y = snap(y); y += (SZ[n.id]?.h || 200) + GAPN + 10; }); }); }
function column(ids, at) { let y = at.y; ids.map(inst).forEach(n => { n.x = snap(at.x); n.y = snap(y); y += (SZ[n.id]?.h || 200) + GAPN + 10; }); }
function addRack(id, at) { const r = RACKS[id], rid = uid("rack-" + id);
  S.racks.push({id: rid, ref: id, name: r.name, removed: [], collapsed: false});
  const ids = insertBlock(r.instances, r.cables.map(c => ({...c, fixed: true})), {rack: rid}); render(); stack(ids, at); placeGroup(ids); return ids; }
function addKit(id, at) { const k = KITS[id]; const ids = insertBlock(k.instances, k.cables.map(c => ({...c, fixed: true})), {kit: id}); render(); column(ids, at); placeGroup(ids); return ids; }
function addDevice(pid, at) { const id = uid(pid.split("/").pop().replace(/[^a-z0-9]/gi, "").slice(0, 10)); S.instances.push({id, profile: pid, name: prof(pid).model || pid, x: at.x, y: at.y}); render(); placeGroup([id]); return id; }
function loadProject(name) {
  S = {name: "Neues Projekt", instances: [], cables: [], racks: [], assign: {}}; past = []; future = []; sel = null; syncUndo();
  const P = DATA.projects[name];
  if (P) { S.name = P.name; const L = [], M = [], R = [];
    (P.instances || []).forEach(i => { const c = prof(i.profile).category; (/camera|computer|wireless/.test(c) ? L : /display|service|recorder|speaker/.test(c) ? R : M).push(i.id); S.instances.push({...i, x: 0, y: 0}); });
    const rk = []; for (const r of P.racks || []) { const rid = uid("rack-" + r.ref), T = RACKS[r.ref]; S.racks.push({id: rid, ref: r.ref, name: T.name, removed: [], collapsed: false});
      T.instances.forEach(it => S.instances.push({...it, rack: rid, x: 0, y: 0})); T.cables.forEach(c => S.cables.push({...c, fixed: true})); rk.push(rid); }
    (P.cables || []).forEach(c => S.cables.push({...c}));
    render(); // messen
    let x = 40; column(L, {x, y: 40}); x += Math.max(260, ...L.map(i => SZ[i]?.w || 0)) + 80;
    rk.forEach(rid => { const ids = S.instances.filter(n => n.rack === rid).map(n => n.id); stack(ids, {x, y: 30}); const w = Math.max(...ids.map(i => inst(i).x + (SZ[i]?.w || 0))); x = w + 100; });

  const kits = Object.entries(KITS).filter(([, x]) => m(x.name)).map(([k, x]) => `<div class="lib-item kit" draggable="true" data-add="kit:${k}" tabindex="0"><b>${esc(x.name)}</b><span>Set · Übergabe ${esc(x.ports.map(p => p.connector).join(", "))}</span></div>`).join("");
  const devs = Object.values(PROF).filter(p => p.kind !== "module" && m((p.manufacturer || "") + " " + p.model)).sort((a, b) => a.model.localeCompare(b.model)).map(p => `<div class="lib-item" draggable="true" data-add="dev:${p.id}" tabindex="0"><b>${esc(p.model)}</b><span>${esc(p.manufacturer || "")} · ${esc(p.category || "")}</span></div>`).join("");
  $("#lib").innerHTML = `<h2>Bibliothek</h2><input class="lib-search" id="q" placeholder="Suchen" value="${esc(filter)}" aria-label="Bibliothek durchsuchen"><h2>Racks</h2>${racks}<h2>Sets</h2>${kits}<h2>Geräte</h2>${devs}`;
  const q = $("#q"); q.addEventListener("input", () => { const v = q.value; buildLib(v); const n = $("#q"); n.focus(); n.setSelectionRange(v.length, v.length); });
  $("#lib").querySelectorAll("[data-add]").forEach(el => el.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", el.dataset.add)));
}
ws.addEventListener("dragover", e => { e.preventDefault(); ws.classList.add("drop"); });
ws.addEventListener("dragleave", () => ws.classList.remove("drop"));
ws.addEventListener("drop", e => { e.preventDefault(); ws.classList.remove("drop"); const v = e.dataTransfer.getData("text/plain"); if (!v) return;
  const at = toStage(e); at.x = snap(Math.max(10, at.x)); at.y = snap(Math.max(30, at.y)); commit();
  const t = v.split(":")[0], id = v.slice(v.indexOf(":") + 1);
  if (t === "rack") { addRack(id, at); toast(`Rack ${RACKS[id].name} eingefügt – komplett mit fester Verkabelung`); }
  if (t === "kit") { addKit(id, at); toast(`Set eingefügt – Übergabe ${KITS[id].ports.map(p => p.connector).join(", ")} an eine passende Buchse ziehen`); }
  if (t === "dev") select(addDevice(id, at));
  render(); showHints(); });

// ---------- Inspektor und Hinweise ----------
function select(id) { sel = id; selCable = null; stage.querySelectorAll(".node").forEach(e => e.classList.toggle("sel", e.dataset.id === id)); showInspector(); highlight(id); }
function highlight(id) { const r = id?.startsWith("g:") ? S.racks.find(x => "g:" + x.id === id) : null, ids = r ? new Set(S.instances.filter(n => n.rack === r.id).map(n => n.id)) : new Set([id]);
  wires.querySelectorAll("path[data-main]").forEach(p => { const c = S.cables[+p.dataset.k]; p.classList.toggle("hot", !!c && (ids.has(split(c.from)[0]) || ids.has(split(c.to)[0]))); }); }
function showInspector() {
  if (sel?.startsWith("g:")) { const r = S.racks.find(x => "g:" + x.id === sel), c = crossing(r);
    $("#insp").innerHTML = `<h2>Rack</h2><div class="sec"><b style="font-size:17px">${esc(r.name)}</b><p>${c.members.length} Geräte, zugeklappt. ${c.ins.length + c.outs.length} Leitungen nach außen.</p><div class="cablelist">${c.members.map(i => `<div>${esc(inst(i).name)}</div>`).join("")}</div><p><button type="button" class="btn" data-fold="${r.id}" id="unf">▸ Aufklappen</button></p><p><button type="button" class="btn" id="back">Zurück zu den Hinweisen</button></p></div>`;
    $("#unf").onclick = () => stage.querySelector(`[data-fold="${CSS.escape(r.id)}"]`)?.click(); $("#back").onclick = () => { sel = null; render(); showHints(); }; return; }
  const n = inst(sel); if (!n) return showHints();
  const p = prof(n.profile), rack = S.racks.find(r => r.id === n.rack);
  const cabs = S.cables.map((c, k) => [c, k]).filter(([c]) => split(c.from)[0] === n.id || split(c.to)[0] === n.id);
  const mixOuts = (p.logic || []).some(l => /mixer|matrix/.test(l.type)) ? (p.ports || []).filter(q => q.direction !== "in" && /audio|sdi|hdmi/i.test(q.signal)) : [];
  const opts = /wing/i.test(n.profile) ? ["frei", "MAIN1 PA", "MAIN2 STREAM", "MAIN3", "MAIN4", "BUS1 MON1", "MTX1"] : /atem/i.test(n.profile) ? ["frei", "ME1 Programm", "ME1 Vorschau", "ME2 Programm", "Multiview", "Clean Feed 1", "In 1", "In 3", "In 5", "In 11", "In 18"] : ["frei", "Programm", "Durchgeschleift"];
  const rows = cabs.filter(([c]) => split(c.from)[0] === n.id && mixOuts.some(q => q.id === base(split(c.from)[1]))).map(([c]) =>
    `<label style="display:grid;gap:4px;margin-bottom:8px"><span style="font-family:var(--mono);font-size:12px">${esc(split(c.from)[1])} → ${esc(c.to)}</span><select data-assign="${esc(c.from)}">${opts.map(o => `<option ${S.assign[c.from] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`).join("");
  $("#insp").innerHTML = `<h2>Gerät</h2><div class="sec"><b style="font-size:17px">${esc(n.name)}</b><dl style="margin-top:8px">
      <dt>Modell</dt><dd>${esc((p.manufacturer || "") + " " + (p.model || ""))}</dd><dt>Profil</dt><dd>${esc(n.profile)}${p.status === "draft" ? " · Entwurf" : ""}</dd>
      ${rack ? `<dt>Rack</dt><dd>${esc(rack.name)} (fest)</dd>` : ""}${n.address ? `<dt>Adresse</dt><dd>${esc(n.address)}</dd>` : ""}</dl>
      ${rack ? `<p style="margin:10px 0 0"><button type="button" class="btn" id="detach">Aus Rack herauslösen</button></p>` : ""}
      <p style="margin:8px 0 0"><button type="button" class="btn" id="del">Gerät entfernen</button></p></div>
    ${rows ? `<h2>Belegung der Ausgänge</h2><div class="sec">${rows}</div>` : ""}
    <h2>Kabel (${cabs.length})</h2><div class="sec cablelist">${cabs.map(([c, k]) => `<div><span>${esc(c.from)} → ${esc(c.to)}${c.fixed ? " · fest" : ""}</span>${c.fixed ? "" : `<button type="button" data-unplug="${k}">Lösen</button>`}</div>`).join("") || "<span>keine</span>"}</div>
    <h2>Buchsen laut Hersteller</h2><div class="sec cablelist">${(p.ports || []).map(q => `<div>${esc(q.id)} · ${q.count > 1 ? q.count + "× " : ""}${esc(q.direction)} · ${esc(q.connector)} · ${esc(q.signal)}</div>`).join("")}</div>
    <p class="sec"><button type="button" class="btn" id="back">Zurück zu den Hinweisen</button></p>`;
  $("#back").onclick = () => { sel = null; render(); showHints(); };
  $("#del").onclick = () => { commit(); S.instances = S.instances.filter(i => i.id !== n.id); S.cables = S.cables.filter(c => split(c.from)[0] !== n.id && split(c.to)[0] !== n.id); if (rack) rack.removed.push(n.name); sel = null; render(); showHints(); toast(`${n.name} entfernt`); };
  if (rack) $("#detach").onclick = () => { commit(); rack.removed.push(n.name); delete n.rack; S.cables = S.cables.filter(c => !(c.fixed && (split(c.from)[0] === n.id || split(c.to)[0] === n.id))); n.x += 60; render(); placeGroup([n.id]); render(); select(n.id); showHints(); toast(`${n.name} aus ${rack.name} herausgelöst – feste Kabel getrennt, Vorlage bleibt gleich`); };
  $("#insp").querySelectorAll("[data-assign]").forEach(s => s.onchange = () => { commit(); S.assign[s.dataset.assign] = s.value; toast(`${s.dataset.assign} ← ${s.value}`); });
  $("#insp").querySelectorAll("[data-unplug]").forEach(b => b.onclick = () => { commit(); S.cables.splice(+b.dataset.unplug, 1); render(); select(n.id); showHints(); });
}
function findings() { const out = [], nm = id => inst(id)?.name || id;
  if (S.racks.length > 1) { const sets = S.racks.map(r => new Set(S.instances.filter(i => i.rack === r.id).map(i => i.id)));
    if (!S.cables.some(c => { const a = split(c.from)[0], b = split(c.to)[0]; return sets.some((s, k) => s.has(a) && sets.some((t, j) => j !== k && t.has(b))); }))
      out.push({l: "err", t: "Racks nicht verbunden", p: "Zwischen den Racks fehlt der Uplink (z. B. PoE-Switch → TL-SG1024). Ohne ihn kein DHCP, Internet und keine Steuerung."}); }
  S.racks.forEach(r => { if (r.removed.length) out.push({l: "warn", t: `${r.name}: ${r.removed.join(", ")} herausgelöst`, p: "Abwandlung nur in diesem Projekt; die Rack-Vorlage bleibt unverändert."}); });
  S.cables.filter(c => c.adapter).forEach(c => out.push({l: "warn", t: "Adapter nötig", p: `${nm(split(c.from)[0])} → ${nm(split(c.to)[0])}: ${c.medium}`}));
  S.cables.filter(c => /wing/i.test(inst(split(c.from)[0])?.profile || "") && /xlr_out/.test(c.from) && !c.fixed && (!S.assign[c.from] || S.assign[c.from] === "frei"))
    .forEach(c => out.push({l: "warn", t: `${nm(split(c.from)[0])} ${split(c.from)[1]}: Belegung offen`, p: `Geht zu ${nm(split(c.to)[0])}. Im Inspektor festlegen, was das Pult auf diesen Ausgang legt.`}));
  const free = S.instances.filter(i => !S.cables.some(c => split(c.from)[0] === i.id || split(c.to)[0] === i.id));
  if (free.length) out.push({l: "warn", t: `${free.length} Geräte ohne Kabel`, p: free.map(i => i.name).join(", ")});
  if (!out.length) out.push({l: "ok", t: "Keine offenen Punkte", p: "Alle Racks verbunden, keine Adapter, alle Ausgänge belegt."});
  return out; }
function showHints() { if (sel) return showInspector();
  $("#insp").innerHTML = `<h2>Hinweise</h2><div class="sec">${findings().map(h => `<div class="hint"><i class="shape ${h.l}" aria-hidden="true"></i><b>${{ok: "OK", warn: "Prüfen", err: "Fehlt"}[h.l]}: ${esc(h.t)}</b><p>${esc(h.p)}</p></div>`).join("")}</div>
  <h2>So geht's</h2><div class="sec" style="font-size:13px;color:var(--sp-fg-muted);display:grid;gap:6px">
    <span>Rack, Set oder Gerät aus der Bibliothek ziehen. Kacheln rasten im Raster ein und rücken auf freien Platz.</span>
    <span>Von einem Ausgang (rechts) zu einem Eingang (links) ziehen: passende Buchsen leuchten blau, unpassende sind grau und nennen den Grund.</span>
    <span>Rack mit „zuklappen“ zu einer Kachel zusammenfassen. Cmd+Mausrad zoomt; weit weg nur Namen, nah alle Buchsen.</span>
    <span>Cmd+Z macht jeden Schritt rückgängig, Shift+Cmd+Z wiederholt ihn.</span></div>`; }

// ---------- Export / Import ----------
$("#exp").onclick = () => { const out = {format: "avrig/0.2", name: S.name, racks: S.racks.map(r => ({ref: r.ref, overrides: {remove: r.removed}, collapsed: r.collapsed, pos: r.pos})), instances: S.instances.map(({x, y, ...i}) => ({...i, pos: [Math.round(x), Math.round(y)]})), cables: S.cables, assign: S.assign,
  embedded: Object.fromEntries([...new Set(S.instances.map(i => i.profile))].map(id => [id, prof(id)]))};
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"})); a.download = (S.name || "projekt").replace(/[^\w-]+/g, "-") + ".avrig.json";
  document.body.appendChild(a); a.click(); a.remove(); toast("Projekt exportiert – mit allen Geräteprofilen eingebettet"); };
$("#imp").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); Object.assign(PROF, d.embedded || {}); commit();
  S = {name: d.name || f.name, racks: (d.racks || []).map(r => ({id: "rack-" + r.ref, ref: r.ref, name: RACKS[r.ref]?.name || r.ref, removed: r.overrides?.remove || [], collapsed: !!r.collapsed, pos: r.pos})), instances: d.instances.map(i => ({...i, x: i.pos?.[0] ?? 40, y: i.pos?.[1] ?? 40})), cables: d.cables || [], assign: d.assign || {}};
  render(); showHints(); toast("Projekt importiert"); } catch { toast("Datei ist kein Rig-Projekt"); } };
document.querySelectorAll("[data-load]").forEach(b => b.onclick = () => { document.querySelectorAll("[data-load]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); loadProject(b.dataset.load); });
window.addEventListener("resize", () => drawWires());
buildLib(); document.querySelector('[data-load="schlank"]').setAttribute("aria-pressed", "true");
(document.fonts?.ready || Promise.resolve()).then(() => loadProject("schlank"));
</script>

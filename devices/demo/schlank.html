<style>
/* Layout: links Quellen, Mitte Wandlung/Netz und Mischer, rechts Senken – Signal läuft von links nach rechts; Seitenleiste zeigt das Profil */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #172028; --muted: #5b6875; --line: #c9d1d9; --node: #ffffff; --node-head: #e3e9ef;

  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #161d23; --ink: #e4e9ee; --muted: #8d9aa6; --line: #2c3740; --node: #18212a; --node-head: #212c36;
  --video: #4d9bff; --audio: #ffaa33; --net: #a98bff; --ctrl: #8d9aa6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --ink: #e4e9ee; --muted: #8d9aa6; --line: #2c3740; --node: #18212a; --node-head: #212c36;
  --video: #4d9bff; --audio: #ffaa33; --net: #a98bff; --ctrl: #8d9aa6; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

.canvas { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: calc(100vh - 140px); }

.node rect.head { fill: var(--node-head); }
.node text.t { font-family: var(--display); font-weight: 600; font-size: 15px; fill: var(--ink); }
.node text.m { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.node text.p { font-family: var(--mono); font-size: 10.5px; fill: var(--ink); }
.node text.pm { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }
.node circle.pin { stroke: var(--panel); stroke-width: 1.5; }
.node { cursor: pointer; transition: opacity .15s; }
.node.sel rect.box { stroke: var(--ink); stroke-width: 1.6; }
.node .draft { fill: var(--audio); }
path.e { fill: none; stroke-width: 1.8; stroke-linejoin: round; opacity: .85; transition: opacity .15s, stroke-width .15s; }

path.e.lan { stroke: var(--line); stroke-width: 1.2; opacity: .9; }

path.e.hot { stroke-width: 3; opacity: 1; stroke-dasharray: 7 9; animation: flow .7s linear infinite; }

.hidelan path.e.lan, .hidelan .node.lanonly { display: none; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; font-size: 13px; min-width: 0; }
aside h2 { font-family: var(--display); font-size: 22px; margin: 0; font-weight: 600; }
aside .kv { color: var(--muted); }
aside table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
aside td { border-top: 1px solid var(--line); padding: 4px 4px 4px 0; vertical-align: top; }
aside .tbl { overflow-x: auto; }
aside ul { margin: 0; padding-left: 18px; }
aside a { color: var(--video); word-break: break-all; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.draft { color: var(--audio); border-color: var(--audio); }
.hint { color: var(--muted); font-size: 12px; }
aside .hints { display: grid; gap: 8px; }

aside .hint-i.warn { border-color: var(--audio); }
aside .hint-i.info { border-color: var(--video); }
aside .hint-i b { display: block; font-weight: 600; }
aside .hint-i span { color: var(--muted); font-size: 12px; }
.btn { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }

#app.noside .main { grid-template-columns: minmax(0, 1fr); }
#app.noside aside { display: none; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 5px; display: none; max-width: 280px; z-index: 5; }
</style>

    el("circle", {class: "pin", cx: px, cy: py, r: 4.2, fill: color(sig(n.id, p)), "data-ref": ref}, g);
    const t = el("text", {class: "p", x: right ? px - 9 : px + 9, y: py + 3.5, "text-anchor": right ? "end" : "start", "data-ref": ref}, g);
    t.textContent = p;
  });
  place(L, false); place(R, true);
  pos[n.id] = {x, y, h}; RECTS.push({x, y, w: W, h});
}
const maxH = Math.max(...colY);
const SVGW = COLX[3] + W + GAPW; svg.setAttribute("width", SVGW); svg.setAttribute("height", maxH + 10);
svg.setAttribute("viewBox", `0 0 ${SVGW} ${maxH + 10}`);

// Kanten: Kabel, Netzströme; innere Wege nur für die Verfolgung
const edges = [];
// Rechtwinklige Leitungen: senkrecht nur in den Gassen zwischen den Spalten, jede Leitung auf eigener Spur;
// waagrechte Übergänge in freien Zwischenräumen, nie über einer anderen Leitung; Ecken mit kleinem Radius.
const laneUse = {}, hUse = [];
function lane(g) {
  const k = laneUse[g] = (laneUse[g] || 0) + 1;
  const x0 = g === 0 ? 8 : COLX[g - 1] + W + 14, room = g === 0 ? COLX[0] - 14 : GAPW - 28;
  const step = 6, slots = Math.max(1, Math.floor(room / step));
  return x0 + ((k - 1) % slots) * step + Math.floor((k - 1) / slots) * 2;
}
function freeY(xa, xb, want) {
  const lo = Math.min(xa, xb), hi = Math.max(xa, xb);
  const blocks = RECTS.filter(r => r.x < hi && r.x + r.w > lo);
  const ok = y => !blocks.some(r => y > r.y - 6 && y < r.y + r.h + 6) && !hUse.some(h => Math.abs(h.y - y) < 5 && h.lo < hi && h.hi > lo);
  for (let d = 0; d < 3000; d += 2) for (const y of [want + d, want - d]) if (y > 6 && ok(y)) { hUse.push({y, lo, hi}); return y; }
  return want;
}
function rounded(pts, r) {
  const p = pts.filter((q, i) => i === 0 || q[0] !== pts[i - 1][0] || q[1] !== pts[i - 1][1]);
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, l1 / 2, l2 / 2);
    if (rr < 0.5) { d += ` L${x1},${y1}`; continue; }
    d += ` L${x1 - (x1 - x0) / l1 * rr},${y1 - (y1 - y0) / l1 * rr} Q${x1},${y1} ${x1 + (x2 - x1) / l2 * rr},${y1 + (y2 - y1) / l2 * rr}`;
  }
  const q = p[p.length - 1]; return d + ` L${q[0]},${q[1]}`;
}
function curve(a, b) {
  const ga = a.right ? a.col + 1 : a.col, gb = b.right ? b.col + 1 : b.col;
  const xa = lane(ga), xb = ga === gb ? xa : lane(gb);
  const pts = ga === gb ? [[a.x, a.y], [xa, a.y], [xa, b.y], [b.x, b.y]]
    : (() => { const yc = freeY(xa, xb, (a.y + b.y) / 2); return [[a.x, a.y], [xa, a.y], [xa, yc], [xb, yc], [xb, b.y], [b.x, b.y]]; })();
  return rounded(pts, 6);
}
function addEdge(from, to, cls, k, title) {
  const a = pos[from], b = pos[to]; if (!a || !b) return;
  const p = el("path", {class: "e " + cls, d: curve(a, b), stroke: cls.includes("lan") ? "" : color(k)}, gE);
  p.dataset.title = title; edges.push({from, to, p});
}
const isLan = c => NETDEV.has(split(c.to)[0]) || NETDEV.has(split(c.from)[0]);
const cableEdge = c => { const lan = isLan(c);
  addEdge(c.from, c.to, (lan ? "lan" : "") + (c.assumed ? " assumed" : ""), sig(...split(c.from)), `${c.medium}${c.fixed ? " · fest im Rack" : ""}${c.assumed ? " · angenommen, nicht geprüft" : ""}`); };
P.cables.filter(c => !isLan(c)).forEach(cableEdge);
P.flows.filter(f => f.kind !== "intern").forEach(f => addEdge(f.from, f.to, "net" + (f.assumed ? " assumed" : ""), f.kind === "Dante" ? "audio" : f.kind === "ST 2110" ? "video" : "net", `${f.kind}: ${f.label}${f.via ? " · über " + inst[f.via].name : ""}`));
P.cables.filter(isLan).forEach(cableEdge);

// Verfolgungsgraph: gerichtete Kanten ohne LAN-Kabel (die laufen als Netzströme)
const fwd = {}, bwd = {};
const link = (a, b) => { (fwd[a] ||= []).push(b); (bwd[b] ||= []).push(a); };
P.cables.forEach(c => { if (![c.from, c.to].some(r => NETDEV.has(split(r)[0]) || split(r)[0] === "sw360")) link(c.from, c.to); });
P.flows.forEach(f => link(f.from, f.to));
P.routes.forEach(r => link(`${r.device}:${r.from}`, `${r.device}:${r.to}`));
function trace(starts) {
  const seen = new Set(starts), hot = new Set();
  for (const [map, dir] of [[fwd, 1], [bwd, -1]]) {
    const q = [...starts], vis = new Set(starts);
    while (q.length) { const a = q.shift(); for (const b of map[a] || []) { hot.add(dir > 0 ? a + ">" + b : b + ">" + a); if (!vis.has(b)) { vis.add(b); q.push(b); seen.add(b); } } }
  }
  return {nodes: new Set([...seen].map(r => split(r)[0])), hot};
}
const keysOf = id => Object.keys({...fwd, ...bwd}).filter(k => split(k)[0] === id);
function show(starts) {
  const {nodes, hot} = trace(starts);
  svg.classList.add("dimmed");
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("hot", nodes.has(n.dataset.id)));
  P.flows.forEach(f => { if (f.via && hot.has(f.from + ">" + f.to)) nodes.add(f.via); });
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("hot", nodes.has(n.dataset.id)));
  edges.forEach(e => e.p.classList.toggle("hot", hot.has(e.from + ">" + e.to)));
}
function clear() { svg.classList.remove("dimmed"); document.querySelectorAll(".hot").forEach(x => x.classList.remove("hot")); }

const tip = document.getElementById("tip");
svg.addEventListener("pointerover", ev => {
  const pin = ev.target.closest("[data-ref]"), node = ev.target.closest(".node"), edge = ev.target.closest("path.e");
  if (pin) { show([pin.dataset.ref]); tip.textContent = pin.dataset.ref.split(":")[1] + " · " + portInfo(pin.dataset.ref); tip.style.display = "block"; }
  else if (node) { show(keysOf(node.dataset.id)); tip.style.display = "none"; }
  else if (edge) { tip.textContent = edge.dataset.title; tip.style.display = "block"; edge.classList.add("hot"); }
});
svg.addEventListener("pointermove", ev => { tip.style.left = ev.clientX + 14 + "px"; tip.style.top = ev.clientY + 12 + "px"; });
svg.addEventListener("pointerout", ev => { if (!ev.relatedTarget || !svg.contains(ev.relatedTarget) || ev.relatedTarget === svg) { clear(); tip.style.display = "none"; } });
function portInfo(ref) { const [i, p] = split(ref); const d = (prof(inst[i].profile).ports || []).find(x => x.id === p.split(".")[0]); return d ? `${d.connector} · ${d.signal}${d.formats ? " · " + d.formats : ""}` : "intern"; }

// Seitenleiste: Profil
const sideEl = document.getElementById("side");
svg.addEventListener("click", ev => {
  const node = ev.target.closest(".node"); if (!node) return;
  document.querySelectorAll(".node.sel").forEach(n => n.classList.remove("sel")); node.classList.add("sel");
  const n = inst[node.dataset.id], pr = prof(n.profile);
  const mods = n.modules ? Object.entries(n.modules).map(([s, m]) => `<li>${esc((pr.slots || []).find(x => x.id === s)?.label || s)}: <b>${esc(m)}</b></li>`).join("") : "";
  const slots = (pr.slots || []).map(s => `<li>${esc(s.label)} – passt: ${esc(s.accepts.join(", "))}</li>`).join("");
  sideEl.innerHTML = `<p><a href="#" id="back">← Hinweise</a></p><h2>${esc(n.name)}</h2>
    <div class="kv">${esc([pr.manufacturer, pr.model].filter(Boolean).join(" "))} · ${esc(pr.category || "")} ${pr.status ? `<span class="pill ${pr.status === "draft" ? "draft" : ""}">${pr.status === "draft" ? "Entwurf" : "geprüft"}</span>` : ""}</div>
    ${n.address ? `<div class="kv">Adresse ${esc(n.address)}</div>` : ""}
    ${RACK[n.id] ? `<div><b>Rack: ${esc(RACK[n.id].name)}</b> – fest verbaut mit ${esc(RACK[n.id].members.filter(m => m !== n.id).map(m => inst[m].name).join(", "))}<br><span class="kv">Übergabe: ${esc((RACK[n.id].ports || []).join("; "))}</span></div>` : ""}
    ${mods ? `<div><b>Gesteckte Module</b><ul>${mods}</ul></div>` : ""}${slots ? `<div><b>Steckplätze</b><ul>${slots}</ul></div>` : ""}
    <div><b>Anschlüsse laut Hersteller</b><div class="tbl"><table>${(pr.ports || []).map(p => `<tr><td>${esc(p.id)}</td><td>${p.count > 1 ? p.count + "× " : ""}${esc(p.direction)}</td><td>${esc(p.connector)}</td><td>${esc(p.signal)}</td></tr>`).join("")}</table></div></div>
    ${(pr.logic || []).length ? `<div><b>Innere Logik</b><ul>${pr.logic.map(l => `<li>${esc(l.type)}: ${esc((l.from || []).join(", "))} → ${esc((l.to || []).join(", "))}</li>`).join("")}</ul></div>` : ""}
    ${(pr.unverified || []).length ? `<div><b>Nicht belegt</b><ul>${pr.unverified.map(u => `<li>${esc(u)}</li>`).join("")}</ul></div>` : ""}
    ${(pr.sources || []).length ? `<div><b>Quellen</b><ul>${pr.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.what || s.url)}</a></li>`).join("")}</ul></div>` : ""}`;
});

// Empfehlungen: aus Regeln über das Projekt berechnet, ändern nichts
function findings() {
  const out = [], name = id => inst[id]?.name || id;
  const unmanaged = P.instances.filter(i => /unmanaged|tl-sg1024/i.test(i.profile));
  for (const sw of unmanaged) {
    const mc = P.flows.filter(f => f.via === sw.id && ["Dante", "NDI"].includes(f.kind));
    if (mc.length) out.push({level: "warn", title: `${name(sw.id)}: Multicast ohne IGMP-Snooping`, text: `${[...new Set(mc.map(f => f.kind))].join(" und ")} laufen über einen unmanaged Switch und gehen an alle Ports. Für diese Größe unkritisch; mit mehr Strömen einen Switch mit IGMP-Snooping vorsehen. ST 2110 nie über diesen Switch.`, ids: [sw.id, ...mc.flatMap(f => [split(f.from)[0], split(f.to)[0]])]});
  }
  for (const r of P.racks || []) {
    const links = P.cables.filter(c => { const a = split(c.from)[0], b = split(c.to)[0]; return r.members.includes(a) !== r.members.includes(b) && (P.racks || []).some(o => o !== r && (o.members.includes(a) || o.members.includes(b))); });
    if (links.length === 1) out.push({level: "info", title: `Ein einziges Kabel zwischen ${r.name} und dem Rest`, text: `Fällt es aus, sind Steuerung, NDI, DHCP und Internet getrennt. Ein zweites Kabel bringt nur mit Switches mit Spanning Tree oder Link-Aggregation etwas; sonst Ersatzkabel bereitlegen.`, ids: links.flatMap(c => [split(c.from)[0], split(c.to)[0]])});
  }
  const st = P.flows.filter(f => f.kind === "ST 2110");
  if (st.length) out.push({level: "info", title: "ST 2110 nur an 10G-Ports", text: "Die Blackmagic-Wandler verhandeln 1G oder 10G, kein 2,5G. An 1G senden sie nur Ton und Zusatzdaten, kein Bild.", ids: [...new Set(st.flatMap(f => [split(f.from)[0], split(f.to)[0], f.via]))]});
  for (const ch of P.changes || []) {
    if (ch.kind === "removed") out.push({level: "warn", title: `${ch.rack}: ${ch.name} herausgelöst`, text: "Abwandlung nur in diesem Projekt; die Rack-Vorlage bleibt unverändert. Fehlende feste Kabel prüfen.", ids: []});
    if (ch.kind === "added") out.push({level: "info", title: `${ch.rack}: ${ch.name} angebaut`, text: "Abwandlung nur in diesem Projekt. Kommt das öfter vor, als neue Rack-Vorlage speichern.", ids: [ch.id]});
    if (ch.kind === "modules") out.push({level: "info", title: `${ch.name}: Modul getauscht`, text: `${JSON.stringify(ch.from)} → ${JSON.stringify(ch.to)}`, ids: [ch.id]});
  }
  const conn = r => { const [i, p] = split(r); const d = (prof(inst[i]?.profile || "").ports || []).find(x => x.id === p.split(".")[0]); return d ? (d.connector + " " + d.signal).toLowerCase() : ""; };
  const mism = P.cables.filter(c => { const a = conn(c.from), b = conn(c.to); return (/sdi/.test(a) && /hdmi/.test(b) && !/sdi/.test(b)) || (/hdmi/.test(a) && !/sdi/.test(a) && /bnc/.test(b)); });
  if (mism.length) out.push({level: "warn", title: "Buchsen passen nicht zusammen", text: mism.map(c => `${name(split(c.from)[0])} → ${name(split(c.to)[0])}: Wandler SDI↔HDMI einplanen`).join("; "), ids: mism.flatMap(c => [split(c.from)[0], split(c.to)[0]])});
  const assumed = [...P.cables, ...P.flows].filter(c => c.assumed);
  if (assumed.length) out.push({level: "warn", title: `${assumed.length} Verbindungen nicht geprüft`, text: assumed.map(c => `${name(split(c.from)[0])} → ${name(split(c.to)[0])}`).join("; "), ids: assumed.flatMap(c => [split(c.from)[0], split(c.to)[0]])});
  const drafts = P.instances.filter(i => prof(i.profile).status === "draft");
  if (drafts.length) out.push({level: "info", title: `${drafts.length} Geräteprofile im Entwurf`, text: "Aus Herstellerquellen erstellt, noch nicht am Gerät geprüft. Erst nach der Prüfung als „geprüft“ markieren.", ids: drafts.map(i => i.id)});
  const generic = P.instances.filter(i => P.generic[i.profile] && /offen/i.test(P.generic[i.profile].model || ""));
  if (generic.length) out.push({level: "info", title: "Modell unbekannt", text: generic.map(i => i.name).join(", ") + " – Modell nennen, dann gibt es ein echtes Profil.", ids: generic.map(i => i.id)});
  return out;
}
function showHints() {
  const f = findings();
  sideEl.innerHTML = `<h2>Hinweise</h2><p class="hint">Empfehlungen aus dem Projekt – nichts davon wird geändert. Maus über einen Hinweis zeigt die betroffenen Geräte; Klick auf ein Gerät öffnet sein Profil.</p>
    <div class="hints">${f.map((h, k) => `<div class="hint-i ${h.level}" data-k="${k}"><b>${esc(h.title)}</b><span>${esc(h.text)}</span></div>`).join("")}</div>`;
  sideEl.querySelectorAll(".hint-i").forEach(d => {
    d.addEventListener("pointerenter", () => { const ids = new Set(f[d.dataset.k].ids); svg.classList.add("dimmed"); document.querySelectorAll(".node").forEach(n => n.classList.toggle("hot", ids.has(n.dataset.id))); });
    d.addEventListener("pointerleave", clear);
  });
}
showHints();
sideEl.addEventListener("click", ev => { if (ev.target.id === "back") { ev.preventDefault(); document.querySelectorAll(".node.sel").forEach(n => n.classList.remove("sel")); showHints(); } });
const fsBtn = document.getElementById("fs"), app = document.getElementById("app"), sideBtn = document.getElementById("sidebtn");
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const isFull = () => !!fsEl() || app.classList.contains("pseudo-fs");
function syncFs() { fsBtn.textContent = isFull() ? "Vollbild beenden" : "Vollbild"; }
fsBtn.addEventListener("click", async () => {
  if (isFull()) {
    if (fsEl()) { try { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch {} }
    app.classList.remove("pseudo-fs"); syncFs(); return;
  }
  const req = app.requestFullscreen || app.webkitRequestFullscreen;
  try { if (!req) throw 0; await req.call(app); } catch { app.classList.add("pseudo-fs"); }
  syncFs();
});
document.addEventListener("fullscreenchange", syncFs); document.addEventListener("webkitfullscreenchange", syncFs);
document.addEventListener("keydown", e => { if (e.key === "Escape" && app.classList.contains("pseudo-fs")) { app.classList.remove("pseudo-fs"); syncFs(); } });
sideBtn.addEventListener("click", () => { const off = app.classList.toggle("noside"); sideBtn.textContent = off ? "Hinweise einblenden" : "Hinweise ausblenden"; sideBtn.setAttribute("aria-expanded", String(!off)); });
const lanBox = document.getElementById("lan");
const applyLan = () => svg.classList.toggle("hidelan", !lanBox.checked);
lanBox.addEventListener("change", applyLan); applyLan();
</script>

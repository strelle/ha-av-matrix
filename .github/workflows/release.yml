name: Release

# Every push to main that touches code creates a release:
#   - bump the version in manifest.json (patch; [minor] / feat: → minor; [major] / feat!: / BREAKING CHANGE → major)
#   - CHANGELOG.md entry from the commit subjects since the last tag
#   - commit "chore(release): vX.Y.Z [skip ci]", tag vX.Y.Z, GitHub release with av_matrix.zip for HACS
# The very first run (no tag yet) releases the version that is already in manifest.json (0.1.0).
# Pushes made with GITHUB_TOKEN never trigger workflows, and bot commits are skipped explicitly → no loop.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip release]') &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    env:
      MANIFEST: custom_components/av_matrix/manifest.json
      CARD: custom_components/av_matrix/frontend/av-matrix-card.js
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          current="$(jq -r .version "$MANIFEST")"
          last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$last_tag" ]; then
            next="$current"
            range="HEAD"
          else
            range="${last_tag}..HEAD"
            msgs="$(git log --no-merges --format=%B "$range")"
            IFS=. read -r major minor patch <<< "${last_tag#v}"
            if grep -qiE '\[major\]|^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$msgs"; then
              next="$((major + 1)).0.0"
            elif grep -qiE '\[minor\]|^feat(\([^)]*\))?:' <<< "$msgs"; then
              next="${major}.$((minor + 1)).0"
            else
              next="${major}.${minor}.$((patch + 1))"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "Tag v${next} already exists - nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "skip=false"
            echo "next=${next}"
            echo "current=${current}"
            echo "range=${range}"
          } >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git log --no-merges --format='- %s (%h)' "${{ steps.version.outputs.range }}" \
            | grep -vE '^- chore\(release\)' > notes.md || true
          [ -s notes.md ] || echo "- Maintenance release" > notes.md
          cat notes.md

      - name: Bump version and changelog
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.next != steps.version.outputs.current
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          jq --indent 2 --arg v "$next" '.version = $v' "$MANIFEST" > manifest.tmp && mv manifest.tmp "$MANIFEST"
          sed -i -E "s/^const CARD_VERSION = \".*\";/const CARD_VERSION = \"${next}\";/" "$CARD"
          python3 - "$next" <<'PY'
          import datetime, pathlib, sys
          version = sys.argv[1]
          notes = pathlib.Path("notes.md").read_text().strip()
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()
          entry = f"## [{version}] - {datetime.date.today().isoformat()}\n\n{notes}\n\n"
          if "\n## [Unreleased]" in text:
              # hand-written notes win; the commit list is appended below them
              text = text.replace("## [Unreleased]", f"## [{version}] - {datetime.date.today().isoformat()}", 1)
              head, _, rest = text.partition(f"## [{version}]")
              nxt = rest.find("\n## [", 1)
              body = rest if nxt < 0 else rest[:nxt]
              tail = "" if nxt < 0 else rest[nxt:]
              text = head + f"## [{version}]" + body.rstrip() + "\n\n### Commits\n\n" + notes + "\n" + tail
          else:
              marker = text.find("\n## [")
              text = text + "\n" + entry if marker < 0 else text[: marker + 1] + entry + text[marker + 1 :]
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" "$CARD" CHANGELOG.md
          git commit -m "chore(release): v${next} [skip ci]"
          git push origin HEAD:main

      - name: Tag, build zip and publish release
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          git tag "v${next}"
          git push origin "v${next}"
          (cd custom_components/av_matrix && zip -r -q ../../av_matrix.zip . -x '*__pycache__*')
          unzip -l av_matrix.zip | tail -n 3
          gh release create "v${next}" av_matrix.zip --title "v${next}" --notes-file notes.md --verify-tag
